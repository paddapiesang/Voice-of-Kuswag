<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice of Kuswag | School Newspaper</title>
<style>
:root{--teal:#087f83;--teal-dark:#075e63;--teal-pale:#e8f5f4;--ink:#9a7424;--muted:#8a7448;--paper:#fff;--bg:#f5f8f7;--line:#e2ebea}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:1160px;margin:auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}.crest{width:48px;height:48px;border-radius:0;background:var(--teal);display:grid;place-items:center;color:white;font-family:Georgia,serif;font-size:25px;font-weight:700;box-shadow:0 7px 18px #087f832b}.school-logo{display:block;height:68px;width:auto;max-width:66px;object-fit:contain}.brand-name{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.4px}.brand-sub{font-size:10px;letter-spacing:2.3px;color:var(--muted);margin-top:3px}.nav-link{font-size:14px;font-weight:650;color:var(--teal-dark);text-decoration:none;padding:10px 17px;border-radius:0;background:var(--teal-pale)}
main{max-width:1160px;margin:auto;padding:46px 28px 70px}.eyebrow{color:var(--teal);font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}.hero{display:block;max-width:820px;margin:0 0 70px}.hero-art{min-height:390px;border-radius:0;overflow:hidden;position:relative;background:linear-gradient(135deg,#0a777b,#39a7a1 58%,#b7dfd8);box-shadow:0 18px 45px #124c4a20}.hero-art:before{content:"";position:absolute;width:290px;height:290px;border:1px solid #ffffff65;border-radius:0;right:-35px;top:-65px}.hero-art:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff55;border-radius:0;right:35px;top:15px}.art-copy{position:absolute;inset:auto 34px 34px;color:white;z-index:1}.art-copy small{letter-spacing:3px;font-weight:750;font-size:11px}.art-copy strong{display:block;font:700 clamp(35px,5vw,58px)/.98 Georgia,serif;max-width:400px;margin-top:14px}.art-lines{position:absolute;left:35px;top:45px;width:170px;height:115px;border-top:2px solid #ffffff88;border-bottom:2px solid #ffffff88;transform:rotate(-12deg)}.hero-copy h1{font:700 clamp(38px,5vw,58px)/1.05 Georgia,serif;margin:14px 0 18px;letter-spacing:-1.4px}.hero-copy p{font-size:16px;line-height:1.8;color:var(--muted);max-width:680px;margin:0 0 27px;text-align:left}.button{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:0;background:var(--teal);color:#fff;padding:14px 21px;font-size:14px;font-weight:750;text-decoration:none;cursor:pointer;box-shadow:0 8px 18px #087f8328}.button:hover{background:var(--teal-dark);transform:translateY(-1px)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.section-head h2{font:700 34px Georgia,serif;margin:8px 0 0}.section-head p{color:var(--muted);font-size:13px;margin:0}.articles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.article{background:#fff;border:1px solid var(--line);border-radius:0;overflow:hidden;transition:.2s;box-shadow:0 5px 18px #18343608}.article:hover{transform:translateY(-4px);box-shadow:0 14px 30px #18343612}.thumb{height:150px;background:linear-gradient(135deg,#d7eeea,#82c7bf);display:flex;align-items:center;justify-content:center;color:var(--teal-dark);font:700 24px Georgia,serif;position:relative;overflow:hidden}.thumb:before{content:"";position:absolute;width:180px;height:180px;border:1px solid #ffffffa0;border-radius:0;right:-35px;top:-70px}.thumb span{position:relative;letter-spacing:3px;font-size:12px}.article-body{padding:20px}.tag{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--teal);text-transform:uppercase}.article h3{font:700 22px/1.15 Georgia,serif;margin:10px 0 9px}.article p{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 18px}.read{border:0;background:none;padding:0;color:var(--teal-dark);font-size:13px;font-weight:800;cursor:pointer}.read span{font-size:18px;vertical-align:-1px;margin-left:5px}
.upload-panel{margin-top:52px;background:var(--teal-pale);border:1px dashed #8bc4be;border-radius:0;padding:25px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.upload-panel h3{font:700 22px Georgia,serif;margin:0 0 6px}.upload-panel p{font-size:13px;color:var(--muted);margin:0;line-height:1.6}.upload-panel input{max-width:230px;font-size:12px;color:var(--muted)}
footer{background:#103f42;color:#d8eeeb;padding:27px 28px;text-align:center;font-size:12px;letter-spacing:.3px}.modal{display:none;position:fixed;inset:0;background:#102d2fcc;z-index:10;padding:22px;align-items:center;justify-content:center}.modal.open{display:flex}.modal-box{background:#fff;border-radius:0;width:min(900px,100%);height:min(85vh,760px);display:flex;flex-direction:column;overflow:hidden}.modal-top{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}.modal-top strong{font-family:Georgia,serif;font-size:19px}.close{border:0;background:var(--teal-pale);color:var(--teal-dark);width:34px;height:34px;border-radius:0;font-size:20px;cursor:pointer}.viewer{flex:1;background:#edf2f1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}.viewer iframe{width:100%;height:100%;border:0;background:#fff}.viewer-note{max-width:420px;line-height:1.7}.viewer-note b{display:block;color:var(--ink);font:700 25px Georgia,serif;margin-bottom:8px}
@media(max-width:760px){.nav{padding:16px 18px}.brand-name{font-size:19px}.brand-sub{font-size:8px}.school-logo{height:56px;max-width:54px}.nav-link{font-size:12px;padding:9px 13px}main{padding:30px 18px 50px}.hero{grid-template-columns:1fr;gap:28px;margin-bottom:52px}.hero-copy{order:1}.articles{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.upload-panel{align-items:start;flex-direction:column}.upload-panel input{max-width:100%}}

.archive-view{padding:8px 0 54px;max-width:900px}
.archive-view[hidden]{display:none}
.archive-top{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.back-button{border:1px solid var(--teal);background:#fff;color:var(--teal-dark);padding:11px 16px;font-weight:750;cursor:pointer}
.archive-view h2{font:700 clamp(30px,4vw,42px)/1.1 Georgia,serif;color:var(--ink);margin:8px 0}
.archive-intro{color:var(--muted);line-height:1.7;margin:0 0 26px}
.archive-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.archive-tile{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);padding:25px 18px;text-align:left;cursor:pointer;color:var(--ink);min-height:112px}
.archive-tile:hover,.archive-tile:focus{background:var(--teal-pale);outline:2px solid var(--teal)}
.archive-tile strong{display:block;font:700 29px Georgia,serif;color:#b28a35;margin-bottom:7px}
.archive-tile span{font-size:12px;color:var(--muted)}
.article-panel{background:#fff;border:1px solid var(--line);padding:24px;max-width:760px}
.article-panel h3{font:700 25px Georgia,serif;color:var(--ink);margin:0 0 12px}
.article-panel p{color:var(--muted);line-height:1.7}
.pdf-placeholder{border:1px dashed #b8c9c6;background:#f8fbfa;padding:30px;text-align:center;margin-top:18px;color:var(--muted)}
@media(max-width:760px){.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.archive-tile{padding:20px 14px}}
@media(max-width:420px){.archive-grid{grid-template-columns:1fr}}

</style>
</head>
<body>
<header><nav class="nav">
<a class="brand" href="#" aria-label="Voice of Kuswag home"></a>

</nav></header>
<main>
<section class="hero">
<div class="hero-copy"><div class="eyebrow">Welkom</div><h1>The Voice of Kuswag.</h1><p>Bly by met die stories van ons Kuswag kinders</p>
<button class="button" type="button" onclick="showArchive()">Artikels <span>→</span></button></div>
</section>

<section id="archive" class="archive-view" hidden aria-live="polite"></section>

</main>
<footer>VOICE OF KUSWAG &nbsp;</footer>



<script>
const archiveYears = [2024, 2025, 2026];
const archiveTerms = ["Kwartaal 1", "Kwartaal 2", "Kwartaal 3", "Kwartaal 4"];
const archive = document.getElementById("archive");
const welcome = document.querySelector(".hero");

function showArchive(){
  welcome.hidden = true;
  archive.hidden = false;
  renderYears();
  archive.scrollIntoView({behavior:"smooth", block:"start"});
}
function renderYears(){
  archive.innerHTML = `
    <div class="archive-top"><button class="back-button" onclick="showWelcome()">← Terug</button></div>
    <div class="archive-grid">
      ${archiveYears.map(year => `<button class="archive-tile" onclick="renderTerms(${year})"><strong>${year}</strong></button>`).join("")}
    </div>`;
}
function renderTerms(year){
  archive.innerHTML = `
    <div class="archive-top"><button class="back-button" onclick="renderYears()">← Alle jare</button><button class="back-button" onclick="showWelcome()">Terug</button></div>
    <h2>${year}</h2>
    <div class="archive-grid">
      ${archiveTerms.map((term,index) => `<button class="archive-tile" onclick="renderArticle(${year},${index+1})"><strong>${term}</strong></button>`).join("")}
    </div>`;
  archive.scrollIntoView({behavior:"smooth", block:"start"});
}
function renderArticle(year,term){
  const pdfFiles = {
    "2024-1": "vonkelprop2024kwartaal1.pdf",
    "2024-2": "vonkelprop2024kwartaal2.pdf",
    "2024-3": "vonkelprop2024kwartaal3.pdf",
    "2025-1": "vonkelprop2025kwartaal1.pdf",
    "2025-2": "vonkelprop2025kwartaal2.pdf",
    "2026-1": "vonkelprop2026kwartaal1.pdf",
    "2026-2": "vonkelprop2026kwartaal2.pdf",
    "2026-3": "vonkelprop2026kwartaal3.pdf"
  };
  const pdfPath = pdfFiles[`${year}-${term}`];
  archive.innerHTML = `
    <div class="archive-top"><button class="back-button" onclick="renderTerms(${year})">← Terug na ${year}</button><button class="back-button" onclick="renderYears()">Alle jare</button></div>
    <div class="eyebrow">${year} • Kwartaal ${term}</div>
    <div class="article-panel">
      <h3>${year} — Kwartaal ${term}</h3>
      ${pdfPath
        ? `<p><a href="/${pdfPath}" target="_blank" rel="noopener">Open PDF in a new tab</a> · <a href="/${pdfPath}" download>Laai PDF af</a></p>
           <div id="pdf-pages" aria-label="Koerantbladsye" style="width:100%;overflow:auto;background:#edf2f1">
             <p role="status">Besig om die koerant te laai…</p>
           </div>`
        : `<div class="pdf-placeholder">niks hierso sorry</div>`}
    </div>`;
  if (pdfPath) renderPdfPages(pdfPath, document.getElementById("pdf-pages"));
  archive.scrollIntoView({behavior:"smooth", block:"start"});
}
async function renderPdfPages(pdfPath, container){
  let loadingTask;
  try {
    const pdfjs = await import("/vendor/pdfjs/pdf.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.mjs";
    loadingTask = pdfjs.getDocument({url: new URL(`/${pdfPath}`, location.origin).href});
    const pdf = await loadingTask.promise;
    if (!container.isConnected) return;
    container.replaceChildren();
    for (let number = 1; number <= pdf.numPages; number++) {
      if (!container.isConnected) break;
      const page = await pdf.getPage(number);
      const base = page.getViewport({scale:1});
      const width = Math.max(240, container.clientWidth);
      const scale = Math.min(window.devicePixelRatio || 1, 1.5) * width / base.width;
      const viewport = page.getViewport({scale});
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      canvas.style.cssText = "display:block;width:100%;height:auto;margin-bottom:12px;background:white";
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", `Koerantbladsy ${number}`);
      container.append(canvas);
      await page.render({canvasContext:canvas.getContext("2d"), viewport}).promise;
      page.cleanup();
    }
  } catch (error) {
    if (container.isConnected) {
      const message = document.createElement("p");
      message.setAttribute("role", "alert");
      message.textContent = "Die koerant kon nie hier laai nie. Gebruik die skakels hierbo om die PDF oop te maak of af te laai.";
      container.append(message);
    }
  } finally {
    if (loadingTask) await loadingTask.destroy();
  }
}
function showWelcome(){
  archive.hidden = true;
  welcome.hidden = false;
  welcome.scrollIntoView({behavior:"smooth", block:"start"});
}
</script>

</body></html>
